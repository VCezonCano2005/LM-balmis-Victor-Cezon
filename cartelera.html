<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header class="cabecera sticky-top">
        <span class="cabecera__logo">Cine</span>
        <nav class="d-flex gap-4">
            <a href="index.html" class="cabecera__enlace">Inicio</a>
            <a href="populares.html" class="cabecera__enlace">Populares</a>
            <a href="cartelera.html" class="cabecera__enlace">Cartelera</a>
        </nav>
    </header>

    <div class="pagina-titulo d-flex flex-column gap-2 px-4 px-md-5 pt-5 pb-3">
        <span class="pagina-titulo__etiqueta">Ahora mismo</span>
        <h1 class="pagina-titulo__h1">En cartelera</h1>
    </div>

    <div class="carrusel-contenedor position-relative overflow-hidden w-100">
        <div id="carrusel-pista" class="carrusel-pista d-flex h-100"></div>
        <button id="btn-anterior" class="carrusel-control carrusel-control--anterior" aria-label="Anterior">&#8592;</button>
        <button id="btn-siguiente" class="carrusel-control carrusel-control--siguiente" aria-label="Siguiente">&#8594;</button>
    </div>

    <footer class="pie mt-5">
        <span>Datos proporcionados por The Movie Database (TMDb)</span>
    </footer>

    <script src="js/constantes.js"></script>
    <script src="js/pelicula.class.js"></script>
    <script src="js/cartelera.class.js"></script>
    <script src="js/cartelera.js"></script>
</body>
</html>
