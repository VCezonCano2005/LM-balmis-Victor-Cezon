<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header class="cabecera sticky-top">
        <span class="cabecera__logo">Cine</span>
        <nav class="d-flex gap-4">
            <a href="index.html" class="cabecera__enlace">Inicio</a>
            <a href="populares.html" class="cabecera__enlace">Populares</a>
            <a href="cartelera.html" class="cabecera__enlace">Cartelera</a>
        </nav>
    </header>

    <section class="hero text-center d-flex flex-column align-items-center py-5 gap-3">
        <span class="hero__etiqueta">Descubre el cine</span>
        <h1 class="hero__titulo">Tu guía de películas</h1>
        <p class="hero__subtitulo">Las películas más populares y la cartelera actual, siempre al día.</p>
    </section>

    <main class="container-fluid px-4 px-md-5 py-4">
        <div class="row g-4">

            <div class="col-12 col-md-6">
                <div class="d-flex justify-content-between align-items-baseline pb-2 mb-3 seccion__cabecera">
                    <h2 class="seccion__titulo">Más populares</h2>
                    <a href="populares.html" class="seccion__enlace-mas">Ver todas →</a>
                </div>
                <div id="lista-populares" class="d-flex flex-column gap-2"></div>
            </div>

            <div class="col-12 col-md-6">
                <div class="d-flex justify-content-between align-items-baseline pb-2 mb-3 seccion__cabecera">
                    <h2 class="seccion__titulo">En cartelera</h2>
                    <a href="cartelera.html" class="seccion__enlace-mas">Ver todas →</a>
                </div>
                <div id="lista-cartelera" class="d-flex flex-column gap-2"></div>
            </div>

        </div>
    </main>

    <footer class="pie mt-5">
        <span>Datos proporcionados por The Movie Database (TMDb)</span>
    </footer>

    <script src="js/constantes.js"></script>
    <script src="js/pelicula.class.js"></script>
    <script src="js/populares.class.js"></script>
    <script src="js/cartelera.class.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
